name: Hanahuac
options:
  bundleIdPrefix: com.hanahuac
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES

targets:
  Hanahuac:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Main source/resource tree. The non-base languages' resources are declared SEPARATELY below as
      # ODR-tagged sources, so they are excluded here to avoid being auto-enumerated into the
      # always-bundled Resources build phase:
      #   - the four `<code>-geo.json` geo-name packs (delivered on demand), and
      #   - the fr/de/ko/nah `.lproj` UI strings — excluded so XcodeGen does not fold them into a
      #     single always-bundled `Localizable.strings` variant group; re-added below as individually
      #     ODR-taggable `.lproj` folder references.
      # en/es-MX have no separate geo pack and stay always-bundled (their `.lproj` are auto-detected
      # here), so only the four non-base languages are excluded.
      - path: Hanahuac
        excludes:
          # Declared explicitly below as an always-bundled resource; exclude here so it is not
          # auto-enumerated into a second, duplicate Copy-Resources entry.
          - "PrivacyInfo.xcprivacy"
          - "Resources/fr-geo.json"
          - "Resources/de-geo.json"
          - "Resources/ko-geo.json"
          - "Resources/nah-geo.json"
          - "fr.lproj"
          - "de.lproj"
          - "ko.lproj"
          - "nah.lproj"
      # Apple privacy manifest — always bundled (no resourceTags), copied into the app bundle's
      # Copy-Resources phase so the App Store toolchain finds PrivacyInfo.xcprivacy at the bundle root.
      - path: Hanahuac/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Non-base languages (fr, de, ko, nah) are delivered as On-Demand Resources. Each language's
      # UI strings (.lproj) AND its geo-name pack JSON carry the same `lang-<code>` tag the provider
      # (ODRLanguagePackProvider, via LanguageDescriptor.odrTags) requests, so the build's ODR tag
      # contract matches the runtime request exactly. Packs are built per app version; there is no
      # OTA/out-of-band update path.
      #
      # The `.lproj` directories are added as folder references (`type: folder`) so each is one
      # individually taggable resource — preventing XcodeGen from merging them into a single
      # always-bundled `Localizable.strings` variant group. Copied into the bundle as `<code>.lproj/`,
      # they stay resolvable by `Bundle.main.path(forResource: code, ofType: "lproj")` once the ODR
      # pack is present. `buildPhase: resources` keeps the JSON in the Copy-Resources phase.
      - path: Hanahuac/fr.lproj
        type: folder
        buildPhase: resources
        resourceTags: [lang-fr]
      - path: Hanahuac/Resources/fr-geo.json
        buildPhase: resources
        resourceTags: [lang-fr]
      - path: Hanahuac/de.lproj
        type: folder
        buildPhase: resources
        resourceTags: [lang-de]
      - path: Hanahuac/Resources/de-geo.json
        buildPhase: resources
        resourceTags: [lang-de]
      - path: Hanahuac/ko.lproj
        type: folder
        buildPhase: resources
        resourceTags: [lang-ko]
      - path: Hanahuac/Resources/ko-geo.json
        buildPhase: resources
        resourceTags: [lang-ko]
      - path: Hanahuac/nah.lproj
        type: folder
        buildPhase: resources
        resourceTags: [lang-nah]
      - path: Hanahuac/Resources/nah-geo.json
        buildPhase: resources
        resourceTags: [lang-nah]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanahuac.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hanahuac
        # App Store compliance & metadata (Info.plist generated via GENERATE_INFOPLIST_FILE).
        # No data encryption beyond Apple-exempt HTTPS, so declare export-compliance exemption to
        # skip the per-submission prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Generated UILaunchScreen so the app renders full-screen on all devices (no letterboxing).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Explicit app version/build for App Store submission.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies: []

  HanahuacTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HanahuacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanahuac.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: Hanahuac

schemes:
  Hanahuac:
    build:
      targets:
        Hanahuac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HanahuacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
