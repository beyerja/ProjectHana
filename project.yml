name: ProjectHana
options:
  bundleIdPrefix: com.projecthana
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES

targets:
  ProjectHana:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProjectHana
    resources:
      - path: ProjectHana/en.lproj
      - path: ProjectHana/fr.lproj
      - path: ProjectHana/de.lproj
      - path: ProjectHana/es-MX.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projecthana.app
        INFOPLIST_FILE: ProjectHana/Info.plist
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies: []

  ProjectHanaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProjectHanaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projecthana.app.tests
        INFOPLIST_FILE: ProjectHanaTests/Info.plist
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: ProjectHana
