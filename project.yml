name: Hanahuac
options:
  bundleIdPrefix: com.hanahuac
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES

targets:
  Hanahuac:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Hanahuac
    resources:
      - path: Hanahuac/en.lproj
      - path: Hanahuac/fr.lproj
      - path: Hanahuac/de.lproj
      - path: Hanahuac/es-MX.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanahuac.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hanahuac
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies: []

  HanahuacTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HanahuacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanahuac.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: Hanahuac

schemes:
  Hanahuac:
    build:
      targets:
        Hanahuac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HanahuacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
