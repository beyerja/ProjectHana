name: "Secret Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A leaked secret can land in any file type, so this workflow has no path filter:
# it runs on every push to main and every PR targeting main.

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets gitleaks comment scan results on the PR.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so gitleaks scans every commit on the branch, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        # v3 is free for personal-account / public repos — no GITLEAKS_LICENSE needed.
        # The action exits non-zero when a secret is detected, failing the check.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
