name: CI

on:
  push:
    branches: [main]
    paths:
      - 'ProjectHana/**'
      - 'ProjectHanaTests/**'
      - 'ProjectHana.xcodeproj/**'
  pull_request:
    branches: [main]
    paths:
      - 'ProjectHana/**'
      - 'ProjectHanaTests/**'
      - 'ProjectHana.xcodeproj/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ProjectHana.xcodeproj \
            -scheme ProjectHana \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ProjectHana.xcodeproj \
            -scheme ProjectHana \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug
