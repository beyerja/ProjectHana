name: CI

# The workflow triggers on pushes/PRs to main AND to feature integration branches
# (`feat/**`) — there is intentionally NO workflow-level `paths:` filter. A path filter
# at this level would skip the whole workflow on docs-only/workflow-only changes, leaving
# the required "Build & Test" check stuck in "Pending" forever and blocking the PR from
# merging.
#
# `feat/**` is included so that per-story PRs which target a feature integration branch
# (e.g. `feat/downloadable-language-packs`) instead of `main` still get CI. Without it,
# story PRs merge into the integration branch completely untested.
#
# Instead of a path filter, a cheap `changes` job detects whether any build-relevant files
# changed and the expensive macOS `Build & Test` job ALWAYS runs but gates its costly
# build/test *steps* on that signal. We deliberately do NOT skip the whole job via a
# job-level `if:`: a job skipped that way reports a `skipped` conclusion, and branch
# protection does NOT reliably treat a skipped *required* check as satisfied — it leaves the
# PR `BLOCKED` (observed on docs-/workflow-only PRs such as the workflow archive commits). By
# always running the job and no-op'ing its steps on non-build changes, "Build & Test" always
# reports a real `success`, so docs/workflow-only PRs stay mergeable while still satisfying
# the required check.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - 'Hanahuac/**'
              - 'HanahuacTests/**'
              - 'Hanahuac.xcodeproj/**'
              - '.github/workflows/**'

  build-and-test:
    name: Build & Test
    needs: changes
    # The job ALWAYS runs (no job-level `if:`) so the required check always reports a real
    # `success`, never a `skipped` that branch protection treats as unsatisfied. The costly
    # macOS build/test STEPS are individually gated on the build-relevant signal, so on a
    # docs/workflow-only PR the job spins up, does nothing, and reports success in seconds.
    runs-on: macos-15

    steps:
      - name: Checkout
        if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@v7

      - name: Build
        if: needs.changes.outputs.build == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hanahuac.xcodeproj \
            -scheme Hanahuac \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Test
        if: needs.changes.outputs.build == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hanahuac.xcodeproj \
            -scheme Hanahuac \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: No build-relevant changes
        if: needs.changes.outputs.build != 'true'
        run: echo "No build-relevant files changed — Build & Test reports success without building."
