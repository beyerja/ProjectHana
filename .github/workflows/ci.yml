name: CI

# The workflow triggers on pushes/PRs to main AND to feature integration branches
# (`feat/**`) — there is intentionally NO workflow-level `paths:` filter. A path filter
# at this level would skip the whole workflow on docs-only/workflow-only changes, leaving
# the required "Build & Test" check stuck in "Pending" forever and blocking the PR from
# merging.
#
# `feat/**` is included so that per-story PRs which target a feature integration branch
# (e.g. `feat/downloadable-language-packs`) instead of `main` still get CI. Without it,
# story PRs merge into the integration branch completely untested.
#
# Instead of a path filter, a cheap `changes` job detects whether any build-relevant files
# changed and the expensive macOS `Build & Test` job is gated on that. When nothing relevant
# changed, "Build & Test" is *skipped* — and GitHub treats a skipped required check as
# passing, so non-code PRs are no longer blocked while still satisfying branch protection.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - 'Hanahuac/**'
              - 'HanahuacTests/**'
              - 'Hanahuac.xcodeproj/**'
              - '.github/workflows/**'

  build-and-test:
    name: Build & Test
    needs: changes
    # Skip the costly macOS build when no build-relevant files changed. A skipped
    # required check counts as success for branch protection, so the PR stays mergeable.
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hanahuac.xcodeproj \
            -scheme Hanahuac \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hanahuac.xcodeproj \
            -scheme Hanahuac \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
